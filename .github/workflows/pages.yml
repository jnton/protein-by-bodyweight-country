name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_dataset.py --output-dir dist/data
      - name: Assemble static site
        run: |
          cp -R web/. dist/
          mkdir -p dist/vendor
          curl --fail --location --retry 3 --retry-all-errors \
            https://cdn.plot.ly/plotly-geo-3.5.1.min.js \
            --output dist/vendor/plotly-geo-3.5.1.min.js
          test -s dist/vendor/plotly-geo-3.5.1.min.js
          test -s dist/data/explorer.json
          rm -f dist/data/protein_bodyweight_country_year.json
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
