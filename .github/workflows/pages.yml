name: Deploy explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate browser contract
        run: |
          node --check web/app.js
          python scripts/check_web_contract.py
      - run: python scripts/build_dataset.py --output-dir dist/data
      - name: Assemble static site
        run: |
          cp -R web/. dist/
          mkdir -p dist/vendor
          curl --fail --location --retry 3 --retry-all-errors \
            https://cdn.plot.ly/plotly-geo-3.5.1.min.js \
            --output dist/vendor/plotly-geo-3.5.1.min.js
          test -s dist/vendor/plotly-geo-3.5.1.min.js
          test -s dist/data/explorer.json
          rm -f dist/data/protein_bodyweight_country_year.json
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test public deployment
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"

          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/" --output /tmp/index.html
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/data/explorer.json" --output /tmp/explorer.json
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$base/vendor/plotly-geo-3.5.1.min.js" --output /tmp/plotly.js

          grep -q 'id="dashboard-shell"' /tmp/index.html
          grep -q 'id="country-search"' /tmp/index.html
          grep -q 'id="benchmark-select"' /tmp/index.html
          grep -q 'id="gdp-chart"' /tmp/index.html
          grep -q 'id="comparison-body"' /tmp/index.html
          test "$(wc -c < /tmp/plotly.js)" -gt 100000

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/explorer.json").read_text(encoding="utf-8"))
          coverage = payload["metadata"]["coverage"]
          assert len(payload["rows"]) == coverage["records"]
          assert payload["metadata"]["version"] == "0.3.0-preview"
          assert coverage["gdp_records"] > 0
          assert any(row[6] is not None for row in payload["rows"])
          print(
              "Live deployment verified:",
              f"{len(payload['countries'])} country entities,",
              f"{len(payload['rows']):,} country-year rows,",
              f"{coverage['gdp_records']:,} GDP matches,",
              payload["metadata"]["version"],
          )
          PY
