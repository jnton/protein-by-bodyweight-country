name: Validate data pipeline

on:
  push:
    branches: [main, portfolio-release]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_dataset.py
      - name: Check generated outputs
        run: |
          test -s data/derived/protein_bodyweight_country_year.csv
          test -s data/derived/protein_bodyweight_country_year.json
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dataset
          path: data/derived/
          retention-days: 14
